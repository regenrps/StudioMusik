# Studio Musik ITERA — lingkungan lokal lengkap dalam Docker.
#
#   docker compose up -d --build
#
#   Aplikasi  : http://localhost:8088     (admin@demo.test / Studio123)
#   Mailpit   : http://localhost:8025     (kotak masuk email uji)
#   Adminer   : http://localhost:8081     (opsional: docker compose --profile tools up -d)
#
# Variabel DOCKER_* dapat ditimpa lewat shell atau berkas .env di folder ini,
# tanpa bentrok dengan variabel Laravel biasa.

name: studio-musik-itera

x-aplikasi: &aplikasi
  build:
    context: .
    args:
      COMPOSER_DEV: "${DOCKER_COMPOSER_DEV:-true}"
  image: studio-musik-itera:lokal
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
    - unggahan:/var/www/html/public/storage
  depends_on:
    mysql:
      condition: service_healthy

x-env: &env
  APP_NAME: "Studio Musik ITERA"
  APP_ENV: "${DOCKER_APP_ENV:-local}"
  APP_DEBUG: "${DOCKER_APP_DEBUG:-false}"
  APP_URL: "${DOCKER_APP_URL:-http://localhost:8088}"
  # Sengaja bukan APP_KEY: nilai kosong akan menutupi .env berisi kunci
  # yang dibuat otomatis oleh entrypoint (lihat docker/entrypoint.sh).
  STUDIO_APP_KEY: "${DOCKER_APP_KEY:-}"
  LOG_STACK: "daily,stderr"
  LOG_LEVEL: "${DOCKER_LOG_LEVEL:-info}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: studio_musik
  DB_USERNAME: studio
  DB_PASSWORD: "${DOCKER_DB_PASSWORD:-studio_lokal_ganti_saya}"
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_ENCRYPTION: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM_ADDRESS: "musikitera@gmail.com"
  STUDIO_SINKRON_VIA_REQUEST: "false"
  # "*" = percayai header X-Forwarded-* dari peer langsung (port forwarding
  # VS Code/devtunnels, ngrok). Aman karena port hanya terikat ke 127.0.0.1.
  # Kosongkan bila DOCKER_APP_BIND=0.0.0.0 tanpa proxy di depannya.
  TRUSTED_PROXIES: "${DOCKER_TRUSTED_PROXIES:-*}"
  CSP_MODE: "${DOCKER_CSP_MODE:-enforce}"

services:
  app:
    <<: *aplikasi
    ports:
      - "${DOCKER_APP_BIND:-127.0.0.1}:${DOCKER_APP_PORT:-8088}:8080"
    environment:
      <<: *env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "true"
      SEED_DEMO: "${DOCKER_SEED_DEMO:-true}"
      ADMIN_EMAIL: "${DOCKER_ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${DOCKER_ADMIN_PASSWORD:-}"

  queue:
    <<: *aplikasi
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--max-time=3600"]
    environment:
      <<: *env
      CONTAINER_ROLE: queue
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    <<: *aplikasi
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *env
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  mysql:
    image: mysql:9.7
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: studio_musik
      MYSQL_USER: studio
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-studio_lokal_ganti_saya}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root_lokal_ganti_saya}"
      TZ: Asia/Jakarta
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Hanya dari komputer ini (port 3307 agar tidak bentrok dengan MySQL Laragon).
      - "127.0.0.1:${DOCKER_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_MAILPIT_PORT:-8025}:8025"

  adminer:
    image: adminer:6
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${DOCKER_ADMINER_PORT:-8081}:8080"
    depends_on:
      - mysql

volumes:
  storage:
  unggahan:
  mysql:
