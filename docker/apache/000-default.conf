<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Batas ukuran unggahan (selaras dengan post_max_size di php.ini).
    LimitRequestBody 125829120

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Folder unggahan publik: tidak pernah mengeksekusi skrip.
    <Directory /var/www/html/public/storage>
        Options -Indexes -ExecCGI
        AllowOverride None
        php_admin_flag engine off
        <FilesMatch "(?i)\.(php[0-9]?|pht|phtml|phar|phps|cgi|pl|py|sh|html?|svg|shtml)$">
            Require all denied
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
    </Directory>

    # Jangan pernah menyajikan berkas tersembunyi (.env, .git, .htaccess).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
